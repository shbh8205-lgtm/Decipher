services:
  - type: web
    name: decipher
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    disk:
      name: decipher-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_USERS
        sync: false
      - key: DATA_DIR
        value: /var/data
      - key: DEMO_BANNER
        value: "false"
      - key: DEMO_SEED
        value: "1"
